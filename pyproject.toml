[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsensing"
version = "0.1.0"
description = "Toy model of collective AC sensing with a quantum sensor array"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ziqi Xu", email = "z559xu@uwaterloo.ca" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["qsensing"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# explicit, so a newer ruff release does not change what CI checks
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
